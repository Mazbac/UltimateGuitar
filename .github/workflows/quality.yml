name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality:
    name: windows-quality
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify runtime tools
        shell: pwsh
        run: |
          node --version
          python --version
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap-toolchain.ps1 -CheckOnly -Json
      - name: Restore pinned dependencies
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap.ps1
      - name: Secret scan
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/secret-scan.ps1
      - name: Python contract tests
        shell: pwsh
        run: python -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: Debug build and CTest
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1 -Configuration Debug -RunTests
      - name: Release build and CTest
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1 -Configuration Release -RunTests
      - name: Validate repository contract
        shell: pwsh
        run: node .automation/validate.mjs
      - name: Validate context integrity
        shell: pwsh
        run: node .automation/context-integrity.mjs
      - name: Validate deterministic context resolution
        shell: pwsh
        run: |
          node .automation/context-pack.mjs --scope all
          node .automation/context-pack.mjs --check
      - name: Run context canaries
        shell: pwsh
        run: node .automation/self-test.mjs
