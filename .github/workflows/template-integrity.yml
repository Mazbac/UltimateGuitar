name: Template Integrity

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: template-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: template-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate repository contract
        run: node .automation/validate.mjs
      - name: Validate context integrity
        run: node .automation/context-integrity.mjs
      - name: Validate deterministic context resolution
        run: |
          node .automation/context-pack.mjs --scope all
          node .automation/context-pack.mjs --check
      - name: Run positive and negative canaries
        run: node .automation/self-test.mjs
